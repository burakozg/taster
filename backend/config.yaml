# Tasting Log — model configuration (the DEFAULTS).
#
# The PWA's Admin tab can override capture_model/lookup_model at runtime —
# that choice is stored on the relay and delivered to the worker with each
# job, so it wins over this file without a rebuild. This file is the
# fallback when no admin override is set.
#
# Edit this file and restart the backend to change which Claude model(s)
# power capture vs. lookup by default, without touching code or secrets. See
# tasting-log-design.md §"which model" discussion: capture is async and
# quality-critical (default: Opus); lookup is interactive and can trade a
# little quality for latency (default: also Opus for now — flip to a Sonnet
# ID once you've measured real latency and are happy with lookup quality).

claude:
  # Model used for /capture/photo and /capture/chat (vision + web search +
  # structured output + query_notes tool).
  capture_model: claude-opus-4-8

  # Model used for /lookup, including shop-mode (photo) lookups.
  lookup_model: claude-opus-4-8

  # Output token ceilings. Capture responses are one structured note — small.
  # Lookup responses are conversational answers over query results.
  # Adaptive thinking is spent from these budgets BEFORE any visible output, so
  # they need headroom well beyond the size of the answer itself; too tight and
  # the response truncates mid-JSON (capture) or comes back empty (lookup).
  max_tokens_capture: 8192
  max_tokens_lookup: 4096

  # Effort level: low | medium | high | xhigh | max. Capture and lookup are
  # both narrow, well-specified extraction/QA tasks — "medium" is a sane
  # default; raise to "high" if you see the model under-thinking on tricky
  # labels or ambiguous lookup questions.
  effort: medium

  # Server-side web search tool: fills gaps not printed on a label (cask
  # finish, roast process, wrapper strength, ...). Capped per call so a
  # research spiral can't run up the bill.
  web_search_max_uses: 3

  # Whether /lookup also gets web search. Applies to all three providers
  # equally — each executes the search server-side, and each needs the tool
  # declared per request (no provider searches implicitly). Mostly matters for
  # shop mode, where you're asking about something that may not be in the vault
  # yet. Set false if you'd rather have faster, vault-only answers.
  web_search_lookup: true

  # Safety cap on the manual tool-use / pause_turn resume loops in
  # capture_service.py and lookup_service.py, so a misbehaving loop can't
  # spin forever and rack up spend.
  max_tool_iterations: 6
