# Tasting Log — QNAP Container Station Application config.
#
# Three services: CouchDB, the worker, and the data-maintenance web UI
# (taster-admin — reached only through Traefik, behind the central login). There's no reverse proxy,
# no DuckDNS, no port-forwarding — the worker never accepts an inbound
# connection at all. It polls the Fly relay (relay/fly.toml) outbound for
# jobs and posts results back the same way, which works through any NAT/
# firewall with zero router configuration. See ARCHITECTURE.md for the
# full relay/worker split and why it replaced the reverse-proxy design.
#
# The worker image is built on your Mac (for the QNAP's actual CPU
# architecture — see deploy.sh) and streamed straight into `docker load`
# on the NAS over a single SSH pipe. No source code, no `build:` context,
# no rsync, no scp — none of the last two work against this NAS's SSH
# setup. See ../INSTALL.md.
#
# All state lives under /share/Container/taster/, including CouchDB's
# actual data directory (bind-mounted, not a Docker-managed named volume)
# — so the whole app's state sits inside one folder tree QNAP's backup
# tools (Hybrid Backup Sync etc.) can capture directly. See
# tasting-log-design.md §7.
#
# Networking (learned the hard way on nas.local): container-to-container
# traffic over the qnet network does NOT work reliably — service names
# don't resolve (no embedded Docker DNS on qnet), and even direct-IP
# connections between two qnet containers failed (worker crash-looped with
# ConnectError against couchdb's qnet IP). So the worker<->couchdb path
# runs over `taster-internal`, a plain Docker bridge private to this app,
# where embedded DNS and container-to-container traffic are guaranteed.
# CouchDB keeps a static qnet IP *additionally*, because that's what
# Obsidian LiveSync clients on the LAN connect to. The worker has no LAN
# presence at all — it only ever dials out (Fly relay via the bridge's
# NAT, couchdb via the bridge).
#
# Static IP: CouchDB's qnet address comes from APP_LAN_IP_COUCHDB, read
# from /share/Container/taster/.env (the same file the worker's env_file
# below points at — Compose auto-loads .env from the compose file's own
# directory for ${...} substitution, no separate file needed). Falls back
# to a placeholder if that var is unset; confirm whatever address you pick
# is actually free first (Container Station's network view, or
# `docker network inspect qnet-static-eth1-dc7e3a` over SSH) before
# applying this file — if it collides with another Application on the same
# qnet network, pick a different one.
#
# TASTER_COUCHDB_LAN_IP is still accepted as a second fallback: this variable
# was renamed to match the other three projects (see homelab/README.md), but the
# .env it is read from lives only on the NAS and is git-ignored, so nothing here
# could rename it there. Either spelling works; drop the old one once the NAS's
# .env has been updated by hand.

# `version:` is obsolete in Compose v2 (v2.29.1-qnap2 warns and ignores it)
# but kept for consistency with the sibling Container Station Applications
# on this NAS, which all carry it.
version: "3"

services:
  taster-couchdb:
    # Stock public image — pulled directly by Docker/Container Station over
    # the internet, no manual transfer needed (unlike taster-worker below,
    # a custom image built on Mac and moved over as a stream). Pinned to
    # the same major version docker-compose.dev.yml tests against, so the
    # environment you verify in matches the one you deploy to (and `latest`
    # can't silently jump a major version under the vault data).
    image: couchdb:3
    container_name: taster-couchdb
    restart: unless-stopped
    # RET-1/RET-3: cap log growth on the NAS share. The default json-file
    # driver is unbounded; CouchDB's own logging stays at its image defaults
    # (RET-3) and is covered by this same rotation. 10m x 3 = 30m ceiling.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      # COUCHDB_USER / COUCHDB_PASSWORD here are the ADMIN bootstrap account
      # the official image creates on first boot — a different account from
      # the worker's own COUCHDB_USER/PASSWORD in .env (a least-privilege
      # member account it authenticates as day-to-day; see INSTALL.md for
      # creating it after this container's first boot).
      - /share/Container/taster/couchdb.env
    volumes:
      # Bind-mounted, not a named volume — this is the actual vault data,
      # and needs to be somewhere QNAP's folder-based backup jobs can see.
      - /share/Container/taster/couchdb/data:/opt/couchdb/data
      # local.d, bind-mounted — and this is not optional. CouchDB's runtime
      # configuration (the CORS settings Obsidian LiveSync requires, and
      # require_valid_user) lived ONLY in the container's writable layer before
      # this mount existed, because the config API writes to
      # /opt/couchdb/etc/local.ini. Recreating the container erased them, and the
      # failure was thoroughly disguised: clients reported "Failed to fetch by
      # API. 201" — a SUCCESS code — while the real cause was visible only in the
      # server log as OPTIONS preflight returning 401. Preflight carries no
      # credentials by design, so without enable_cors CouchDB answers it 401 and
      # the client's real request never happens.
      #
      # 10-obsidian-livesync.ini in this directory holds those settings. With
      # this mount in place, Fauxton and config-API writes persist as well —
      # CouchDB writes them to the last file in its ini chain, docker.ini, which
      # is now in this bind-mounted directory (its own [couchdb] uuid is there,
      # which is how you can tell). Prefer the .ini file anyway: it records why.
      #
      # The entrypoint also writes docker.ini here (the hashed admin password
      # from couchdb.env), which is why the directory must be writable by the
      # container.
      - /share/Container/taster/couchdb/config:/opt/couchdb/etc/local.d
    # No read_only/tmpfs hardening here, unlike the worker below — CouchDB
    # writes internal config/state under /opt/couchdb beyond just the data
    # dir (exact paths aren't nailed down), and getting that wrong breaks
    # the database in a much worse way than a slightly looser container.
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Stockholm
    healthcheck:
      # CouchDB's official image is Debian-based (has bash); a bare TCP
      # check is enough to know it's accepting connections before the
      # worker tries to create its database on first boot. This is what
      # makes `depends_on: condition: service_healthy` below meaningful —
      # without it, both containers starting together for the first time
      # is a real race (the worker's ensure_db_and_indexes() has no retry
      # loop and will fail startup if CouchDB isn't ready yet).
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/5984' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      # qnet: the LAN-facing address Obsidian LiveSync clients sync against.
      # Network name and IP are specific to this NAS's Container Station
      # macvlan setup (find yours with `docker network ls`) — pick any free
      # address on your LAN's subnet.
      qnet-static-eth1-dc7e3a:
        ipv4_address: ${APP_LAN_IP_COUCHDB:-${TASTER_COUCHDB_LAN_IP:-10.0.0.2}}
        # Pinned PER NETWORK — couchdb is on two, and a service-level
        # `mac_address:` would apply to only one of them (it landed on the wrong
        # interface when tried that way on the podcast agent).
        #
        # Why pin: docker randomises the MAC on every `create`, and the router
        # keeps answering for the old one afterwards. CouchDB comes back healthy
        # and unreachable inbound for minutes — and the LiveSync clients on the
        # LAN are precisely what this address exists for. Filled in by `./deploy`
        # from APP_LAN_IP_COUCHDB; the value encodes the real address, so it is a
        # placeholder here for the same reason the address itself is.
        mac_address: APP_MAC_COUCHDB_PLACEHOLDER
      # bridge: where the worker reaches it (as http://taster-couchdb:5984).
      taster-internal:

  taster-worker:
    # No `build:` — this image is created on Mac (docker buildx build
    # --platform <NAS arch> --load) and loaded here via `docker load`, not
    # built on the NAS. `docker load` must run before `docker-compose up`
    # picks this tag up; Compose won't try to pull it since a local match
    # exists.
    image: taster-worker:nas
    container_name: taster-worker
    restart: unless-stopped
    # RET-1: same rotation cap as couchdb — the worker's heartbeat + per-job
    # lines are low-volume (GEN-6), but a crash loop could still spew, so
    # bound it. This is where `docker logs taster-worker` reads from (RET-4).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "1000:100"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      taster-couchdb:
        condition: service_healthy
    env_file:
      # COUCHDB_URL in here should be http://taster-couchdb:5984 — the
      # service name, resolved by Docker's embedded DNS on taster-internal.
      # RELAY_URL/WORKER_API_KEY point this worker at the Fly relay — the
      # only network destination it ever initiates a connection to besides
      # CouchDB. config.yaml (model/effort/token settings) is baked into
      # the image rather than bind-mounted — changing it means rebuilding
      # and re-transferring the image (see ../deploy), not just
      # editing a file and restarting.
      - /share/Container/taster/.env
    environment:
      - TZ=Europe/Stockholm
      - ADMIN_DATA_DIR=/data
    volumes:
      # The change history shared with taster-admin (app/history.py): pairings and
      # fetched details applied from the phone app land in the same undo list as
      # the ones applied from the web page. ./deploy creates and opens the directory.
      - /share/Container/taster/admin:/data
    networks:
      # Bridge only — no qnet, no LAN IP. The worker accepts nothing
      # inbound and dials out via the bridge's NAT (Fly relay) and the
      # bridge itself (couchdb). See the networking note in the header.
      - taster-internal

  taster-admin:
    # The data-maintenance web UI (backend/app/admin_web.py): edit fields, and
    # regenerate / re-match pairings for one, some or all items. SAME image as
    # the worker, different command — nothing extra to build or ship. It talks
    # to CouchDB directly over taster-internal, so it needs none of the Fly
    # relay's job queue, and nothing about it is on the internet.
    #
    # Reached through Traefik at a hostname under the homelab's shared domain,
    # behind the central login (homelab-auth, via Traefik's forwardAuth) — no key
    # of its own. That holds ONLY because this service publishes no port and is
    # reachable solely over homelab-internal (the bridge shared with Traefik):
    # never add `ports:` here, it would be a way around the login. The Traefik
    # router/service for it live in Traefik's own dynamic-config.yml on the NAS
    # (not in this repo) — see ARCHITECTURE.md for the entry to add.
    image: taster-worker:nas
    container_name: taster-admin
    command: ["python", "-m", "app.admin_web"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "1000:100"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    depends_on:
      taster-couchdb:
        condition: service_healthy
    env_file:
      - /share/Container/taster/.env
    environment:
      - TZ=Europe/Stockholm
      # Fixed, so a stray ADMIN_PORT in .env can't move the listener away from
      # the port Traefik's service points at.
      - ADMIN_PORT=8088
      - ADMIN_DATA_DIR=/data
    volumes:
      # Undo history (history.jsonl). `./deploy` creates the directory and makes
      # it writable for uid 1000.
      - /share/Container/taster/admin:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8088/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - taster-internal   # CouchDB
      - homelab-internal  # Traefik reaches it here as http://taster-admin:8088

networks:
  qnet-static-eth1-dc7e3a:
    external: true
  # Shared with Traefik and the other homelab apps (created outside this file).
  homelab-internal:
    external: true
  # Private to this Application — created by compose, standard bridge
  # driver, so service-name DNS and container-to-container traffic work
  # (unlike qnet, see header comment).
  taster-internal:
