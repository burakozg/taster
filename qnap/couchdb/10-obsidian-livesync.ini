; Obsidian LiveSync's required CouchDB configuration.
;
; This file exists because these settings USED to live only in the container's
; writable layer — CouchDB's config API writes to /opt/couchdb/etc/local.ini,
; which was not bind-mounted — so recreating the container silently erased them.
; Sync then failed with "Failed to fetch by API. 201" on the clients while the
; server log showed the real cause: OPTIONS preflight returning 401.
;
; Kept in local.d/, which IS bind-mounted, so a recreate cannot lose it again.
;
; Changes made through Fauxton or the config API now persist too, but NOT here:
; CouchDB writes them to the last file in its ini chain, which is docker.ini in
; this same directory (that is where its own [couchdb] uuid lives). The
; entrypoint only ever appends to that file, so those writes survive a restart.
; Prefer this file anyway — it is the one that says WHY each value is set.

[chttpd]
require_valid_user = true
enable_cors = true
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[httpd]
enable_cors = true
WWW-Authenticate = Basic realm="couchdb"

[couchdb]
max_document_size = 50000000

; Without enable_cors above, CouchDB treats a CORS preflight as an ordinary
; request to the resource: OPTIONS carries no credentials by design, so it is
; answered 401 and the client's real request never happens. That is exactly the
; failure this file fixes.
[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET,PUT,POST,HEAD,DELETE
max_age = 3600
