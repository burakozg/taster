# fly.toml app configuration file for the Tasting Log relay.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'your-taster-relay'   # change to a unique name: fly apps create <name>
primary_region = 'arn'      # Stockholm; pick your nearest region

[build]

[[mounts]]
  source = 'your_taster_relay_data'   # match the app name above
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
